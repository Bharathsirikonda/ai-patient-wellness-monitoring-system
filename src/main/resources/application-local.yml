server:
  port: ${PORT:8080}

spring:
  datasource:
    url: jdbc:h2:mem:wellness_localdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  llm:
    provider: ${LLM_PROVIDER:FALLBACK}
    api-key: ${LLM_API_KEY:}
    api-url: ${LLM_API_URL:https://api.openai.com/v1}
    model: ${LLM_MODEL:gpt-4o-mini}
    connect-timeout-ms: 5000
    read-timeout-ms: 20000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
