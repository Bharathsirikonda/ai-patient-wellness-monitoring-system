services:
  - type: web
    name: ai-patient-wellness-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: local
      - key: LLM_PROVIDER
        value: FALLBACK
      - key: JWT_SECRET
        generateValue: true
